name: Release

# 打 v* 标签即构建 DMG 并发布到 Releases；也可手动触发只产出构建物（不建 Release）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v 前缀），仅用于手动试跑"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 显示工具链版本
        run: swift --version

      - name: 解析版本号
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${TAG_NAME#v}"
          else
            VERSION="${INPUT_VERSION:-0.0.0-dev}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg=build/Gotify-Mac-${VERSION}.dmg" >> "$GITHUB_OUTPUT"

      # CI 有完整 Xcode，Testing.framework 在默认搜索路径内，
      # 不需要 scripts/test.sh 为纯 CLT 环境做的额外 -F/-rpath 处理。
      # 不设 GOTIFY_E2E，打真实服务端的集成测试自动跳过。
      - name: 单元测试
        run: swift test

      # runner 是 Apple Silicon，显式指定双架构以便 Intel Mac 也能运行。
      - name: 构建 .app（通用二进制）
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_BUILD: ${{ github.run_number }}
          APP_ARCHS: "arm64 x86_64"
        run: scripts/build-app.sh release

      - name: 检查二进制架构
        run: lipo -info "build/Gotify Mac.app/Contents/MacOS/GotifyMac"

      - name: 打包 DMG
        run: scripts/make-dmg.sh "${{ steps.meta.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: Gotify-Mac-${{ steps.meta.outputs.version }}-dmg
          path: ${{ steps.meta.outputs.dmg }}
          if-no-files-found: error

      - name: 发布到 Releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG: ${{ steps.meta.outputs.dmg }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 安装

          下载 DMG → 打开 → 把 **Gotify Mac** 拖进「应用程序」。

          安装包为 ad-hoc 签名、未经 Apple 公证，首次打开会被 Gatekeeper 拦截，任选一种方式放行：

          - 在「应用程序」里右键点图标 → **打开** → 弹窗里再点「打开」；
          - 或执行 `xattr -dr com.apple.quarantine "/Applications/Gotify Mac.app"`。

          应用无 Dock 图标，启动后在菜单栏出现铃铛图标。首次使用点铃铛 → 齿轮菜单 → **设置…** 填入服务器地址与 Client Token。

          需要 macOS 14 (Sonoma) 或更高版本。
          EOF
          gh release create "$TAG_NAME" "$DMG" \
            --title "Gotify Mac $VERSION" \
            --notes-file release-notes.md \
            --generate-notes
